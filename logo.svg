<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g fill="none" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round">
    <!-- antennas -->
    <path d="M25 12 L17 4 M39 12 L47 4" stroke-width="3"/>
    <!-- TV body -->
    <rect x="5" y="12" width="54" height="40" rx="6" stroke-width="3.5"/>
  </g>
  <!-- screen: translucent glass like the SubSleuth lens -->
  <rect x="12" y="19" width="36" height="26" rx="3" fill="rgba(10,10,15,0.15)" stroke="#3ecf8e" stroke-width="2.5"/>
  <!-- glass highlight -->
  <circle cx="18" cy="24" r="2.5" fill="#3ecf8e" opacity="0.2"/>
  <!-- snake, scaled to 70% and moved left so it clears the right edge of the screen -->
  <g transform="translate(29 32) scale(0.7) translate(-30 -32)">
    <path d="M15 37 C19 27 24 27 27 34 C30 41 35 41 37 33 C38.5 28.5 40 27.5 42 28" fill="none" stroke="#3ecf8e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tongue -->
    <path d="M45 28 L49.5 25.5 M45 28 L49.5 30.5" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="43" cy="28" r="3.8" fill="#3ecf8e"/>
    <!-- eye, cut out in the app background colour -->
    <circle cx="43.8" cy="27.2" r="0.9" fill="#171717"/>
  </g>
  <!-- dials -->
  <circle cx="53.5" cy="26" r="1.8" fill="#3ecf8e"/>
  <circle cx="53.5" cy="36" r="1.8" fill="#3ecf8e"/>
  <!-- stand -->
  <path d="M19 52 L16 59 M45 52 L48 59" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round"/>
</svg>
